<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><rect width="1440" height="940" fill="#061724"/><rect x="56" y="53" width="52" height="4" fill="#49dbec"/><text x="126" y="63" fill="#76dce7" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">CASO ATALAYA</text><text x="56" y="125" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="600">RSC-001 · Una cadena que cruza dominios</text><text x="56" y="169" fill="#b4c5cf" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400">Secuencia del riesgo: no implica que todos los eslabones llegaran a ejecutarse.</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#49dbec"/></marker></defs><rect x="56" y="220" width="408" height="180" rx="14" fill="#0c2738" stroke="#49dbec"/><text x="78" y="255" fill="#76dce7" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">01</text><text x="78" y="294" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600">Encargo</text><text x="78" y="333" fill="#e8eef2" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">El instigador busca</text><text x="78" y="363" fill="#e8eef2" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">información para presionar.</text><rect x="516" y="220" width="408" height="180" rx="14" fill="#0c2738" stroke="#49dbec"/><text x="538" y="255" fill="#76dce7" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">02</text><text x="538" y="294" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600">Delegación</text><text x="538" y="333" fill="#e8eef2" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Recurre a un intermediario</text><text x="538" y="363" fill="#e8eef2" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">del entorno local.</text><rect x="976" y="220" width="408" height="180" rx="14" fill="#0c2738" stroke="#49dbec"/><text x="998" y="255" fill="#76dce7" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">03</text><text x="998" y="294" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600">Aproximación</text><text x="998" y="333" fill="#e8eef2" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">El hijo mayor busca contacto</text><text x="998" y="363" fill="#e8eef2" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">con el intermediario.</text><rect x="976" y="455" width="408" height="180" rx="14" fill="#0c2738" stroke="#49dbec"/><text x="998" y="490" fill="#76dce7" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">04</text><text x="998" y="529" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600">Extracción</text><text x="998" y="568" fill="#e8eef2" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Se filtran rutinas, viajes</text><text x="998" y="598" fill="#e8eef2" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">y detalles de seguridad.</text><rect x="516" y="455" width="408" height="180" rx="14" fill="#0c2738" stroke="#49dbec"/><text x="538" y="490" fill="#76dce7" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">05</text><text x="538" y="529" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600">Confirmación</text><text x="538" y="568" fill="#e8eef2" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Vigilancia física</text><text x="538" y="598" fill="#e8eef2" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">del perímetro.</text><rect x="56" y="455" width="408" height="180" rx="14" fill="#0c2738" stroke="#49dbec"/><text x="78" y="490" fill="#76dce7" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">06</text><text x="78" y="529" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600">Ejecución prevista</text><text x="78" y="568" fill="#e8eef2" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Aproximación coactiva</text><text x="78" y="598" fill="#e8eef2" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">al principal.</text><path d="M464 310H505" fill="none" stroke="#49dbec" stroke-width="3" marker-end="url(#arrow)"/><path d="M924 310H965" fill="none" stroke="#49dbec" stroke-width="3" marker-end="url(#arrow)"/><path d="M1180 400V444" fill="none" stroke="#49dbec" stroke-width="3" marker-end="url(#arrow)"/><path d="M976 545H935" fill="none" stroke="#49dbec" stroke-width="3" marker-end="url(#arrow)"/><path d="M516 545H475" fill="none" stroke="#49dbec" stroke-width="3" marker-end="url(#arrow)"/><rect x="56" y="685" width="1328" height="159" rx="14" fill="#172b36" stroke="#bd9765"/><text x="80" y="723" fill="#e6bc87" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">EL PUNTO DE PARTIDA DEL SGSI</text><text x="80" y="761" fill="#e8eef2" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">En el relato, reconocer un vehículo y relacionarlo con fotos permitió detectar la amenaza.</text><text x="80" y="798" fill="#e8eef2" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Fue una detección fortuita; el tratamiento diseñado pretende hacer verificable la respuesta.</text><text x="56" y="895" fill="#b4c5cf" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400">Escenario ficticio · Síntesis sin controles ni datos personales · No acredita eficacia ni reducción del residual.</text></svg>
