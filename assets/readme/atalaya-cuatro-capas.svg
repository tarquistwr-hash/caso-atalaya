<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760"><rect width="1440" height="760" fill="#061724"/><rect x="56" y="53" width="52" height="4" fill="#49dbec"/><text x="126" y="63" fill="#76dce7" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">CASO ATALAYA</text><text x="56" y="125" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="600">Cuatro capas, un mismo caso</text><text x="56" y="169" fill="#b4c5cf" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400">La metodología define la regla; el validador la comprueba sobre el registro.</text><rect x="56" y="214" width="644" height="198" rx="15" fill="#0c2738" stroke="#49dbec" /><text x="80" y="254" fill="#76dce7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">01 / DISEÑO</text><text x="80" y="293" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="600">SGSI ISO/IEC 27001</text><text x="80" y="327" fill="#e8eef2" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Riesgos, políticas, controles y privacidad.</text><text x="80" y="356" fill="#e8eef2" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Diseño publicado; SGSI en implantación.</text><text x="80" y="389" fill="#76dce7" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">PUBLICADA</text><rect x="740" y="214" width="644" height="198" rx="15" fill="#0c2738" stroke="#49dbec" /><text x="764" y="254" fill="#76dce7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">02 / VERIFICACIÓN</text><text x="764" y="293" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="600">Validador Python</text><text x="764" y="327" fill="#e8eef2" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Comprueba cobertura de dominios aplicables.</text><text x="764" y="356" fill="#e8eef2" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">No acredita aceptación del riesgo residual.</text><text x="764" y="389" fill="#76dce7" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">PUBLICADA</text><rect x="56" y="442" width="644" height="198" rx="15" fill="#0c2738" stroke="#bd9765" stroke-dasharray="7 5"/><text x="80" y="482" fill="#76dce7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">03 / DESARROLLO PREVISTO</text><text x="80" y="521" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="600">Herramienta de IA</text><text x="80" y="555" fill="#e8eef2" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Huella digital y exposición OSINT.</text><text x="80" y="584" fill="#e8eef2" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Prevista sobre RSC-001, RSC-002 y RSC-015.</text><text x="80" y="617" fill="#e6bc87" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">SIN INICIAR</text><rect x="740" y="442" width="644" height="198" rx="15" fill="#0c2738" stroke="#bd9765" stroke-dasharray="7 5"/><text x="764" y="482" fill="#76dce7" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">04 / GOBIERNO PREVISTO</text><text x="764" y="521" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="600">Gobernanza ISO/IEC 42001</text><text x="764" y="555" fill="#e8eef2" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Gobierno de la futura herramienta de IA.</text><text x="764" y="584" fill="#e8eef2" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400">Requisitos según el uso concreto.</text><text x="764" y="617" fill="#e6bc87" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">SIN INICIAR</text><text x="56" y="700" fill="#b4c5cf" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400">Escenario ficticio · Ningún control del registro está IMPLEMENTADO al corte de 24/07/2026.</text></svg>
